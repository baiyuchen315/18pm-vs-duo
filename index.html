<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>18PM vs Duo 决策矩阵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky score bar on top; inputs left and results right on wide screens, stacked on phones.
   Cool graphite neutrals; blue = 18 Pro Max, orange = Duo. Numbers in a mono face. */
:root {
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --surface-2: #E6EAF0;
  --fg: #141A23;
  --muted: #566172;
  --line: #D3D9E1;
  --pm: #2563C9;
  --pm-text: #1C4FA6;
  --pm-fill: rgba(37, 99, 201, 0.18);
  --duo: #D9660B;
  --duo-text: #A34700;
  --duo-fill: rgba(217, 102, 11, 0.18);
  --font-body: 'IBM Plex Sans', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117;
    --surface: #151B24;
    --surface-2: #212A37;
    --fg: #E8ECF2;
    --muted: #9AA6B6;
    --line: #2B3442;
    --pm: #6EA2FF;
    --pm-text: #8DB8FF;
    --pm-fill: rgba(110, 162, 255, 0.22);
    --duo: #FF9A4D;
    --duo-text: #FFB070;
    --duo-fill: rgba(255, 154, 77, 0.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117;
  --surface: #151B24;
  --surface-2: #212A37;
  --fg: #E8ECF2;
  --muted: #9AA6B6;
  --line: #2B3442;
  --pm: #6EA2FF;
  --pm-text: #8DB8FF;
  --pm-fill: rgba(110, 162, 255, 0.22);
  --duo: #FF9A4D;
  --duo-text: #FFB070;
  --duo-fill: rgba(255, 154, 77, 0.22);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--font-body);
}
.gut {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
}

/* Sticky score bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 19;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 20px;
  padding-block: 10px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand strong { font-size: 15px; font-weight: 600; }
.brand span { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.chip { display: inline-flex; align-items: baseline; gap: 7px; font-size: 13px; color: var(--muted); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; align-self: center; }
.chip.pm i { background: var(--pm); }
.chip.duo i { background: var(--duo); }
.chip b { font: 500 17px var(--font-num); color: var(--fg); font-variant-numeric: tabular-nums; }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 56px; }

.tools { display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
button, a.btn {
  display: inline-block;
  text-decoration: none;
  font: 500 13px var(--font-body);
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 12px;
  cursor: pointer;
}
button:hover, a.btn:hover { background: var(--surface-2); }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible, input:focus-visible, a.btn:focus-visible { outline: 2px solid var(--pm); outline-offset: 2px; }
.tools .spacer { flex: 1 1 0; min-width: 0; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 16px; }
@media (min-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: start; gap: 36px; }
}
h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.sec-head { display: flex; align-items: baseline; margin-bottom: 10px; }

/* Inputs: groups contain items */
.grp { margin-top: 18px; }
.grp-head { background: var(--surface-2); border-radius: 6px; padding: 10px 12px 8px; }
.grp-top { display: flex; align-items: center; gap: 10px; }
.grp-top .gname { margin: 0; min-width: 0; font-size: 15px; font-weight: 600; }
button.gtog { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; border: 0; border-radius: 0; background: transparent; padding: 2px 0; text-align: left; font: inherit; color: var(--fg); }
button.gtog:hover { background: transparent; }
button.gtog.chev-only { flex: none; padding-right: 2px; }
.gtog .chev { margin-right: 0; flex: none; }
.gtog.open .chev { transform: rotate(90deg); }
.gcount { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.undo { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.undo[hidden] { display: none; }
.gout { font: 500 14px var(--font-num); font-variant-numeric: tabular-nums; }
.grp-head input[type="range"] { display: block; width: 100%; margin: 6px 0 0; accent-color: var(--fg); }
.grp-body { margin-left: 4px; padding-left: 12px; border-left: 2px solid var(--line); }
.nm-in {
  flex: 1 1 auto; min-width: 0; width: 100%;
  font: 600 15px var(--font-body); color: var(--fg);
  background: transparent; border: 0; border-bottom: 1px dashed var(--muted);
  border-radius: 0; padding: 2px 0;
}
.x { border: 0; background: transparent; color: var(--muted); padding: 0 6px; font-size: 18px; line-height: 1.2; }
.x:hover { background: transparent; color: var(--fg); }
.add { margin-top: 8px; border-style: dashed; color: var(--muted); }
#add-g { margin-top: 18px; }
.dim { padding: 14px 0 16px; border-top: 1px solid var(--line); }
.dim:first-child { border-top: 0; }
.dim-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.dim h3 { margin: 0; font-size: 15px; font-weight: 600; }
.dim-r { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.dim .share { font: 12.5px var(--font-num); color: var(--muted); white-space: nowrap; }
.sliders { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 520px) { .sliders { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; } }
.s { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; font-size: 13px; }
.s span { font-weight: 500; }
.s output { font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; }
.s input { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; }
.s.pm span, .s.pm output { color: var(--pm-text); }
.s.pm input { accent-color: var(--pm); }
.s.duo span, .s.duo output { color: var(--duo-text); }
.s.duo input { accent-color: var(--duo); }
.s.w input { accent-color: var(--muted); }
.s.w span { color: var(--muted); }

/* Results */
.results { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.res { padding: 18px 18px 20px; }
.res + .res { border-top: 1px solid var(--line); }
.totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 10px; }
.tot { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.tot.lead.pm { border-color: var(--pm); }
.tot.lead.duo { border-color: var(--duo); }
.tl { font-size: 13px; color: var(--muted); }
.tn { font: 500 38px/1.15 var(--font-num); font-variant-numeric: tabular-nums; }
.tot.pm .tn { color: var(--pm-text); }
.tot.duo .tn { color: var(--duo-text); }
.tn small { font-size: 14px; color: var(--muted); margin-left: 4px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.tot.pm .meter i { background: var(--pm); }
.tot.duo .meter i { background: var(--duo); }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width 0.2s ease; } }
.verdict { margin: 14px 0 0; font-size: 15px; }
.verdict b { font-weight: 600; }

.radar-wrap { max-width: 460px; margin: 6px auto 0; }
svg.radar { display: block; width: 100%; height: auto; }
.ring { fill: none; stroke: var(--line); stroke-width: 1; }
.ring.outer { stroke: var(--muted); stroke-opacity: 0.6; }
.axis { stroke: var(--line); stroke-width: 1; fill: none; }
.ser-pm { fill: var(--pm-fill); stroke: var(--pm); stroke-width: 2; stroke-linejoin: round; }
.ser-duo { fill: var(--duo-fill); stroke: var(--duo); stroke-width: 2; stroke-linejoin: round; }
.dot-pm { fill: var(--pm); }
.dot-duo { fill: var(--duo); }
.ax-label { fill: var(--fg); font-size: 12px; font-family: var(--font-body); }
.tick { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .pm i { background: var(--pm); }
.legend .duo i { background: var(--duo); }

.axis-cap { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 3.6em; gap: 10px; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.axis-cap div { display: flex; justify-content: space-between; }
.axis-cap .l { color: var(--duo-text); }
.axis-cap .r { color: var(--pm-text); }
.brow { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 3.6em; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
button.grow {
  width: 100%; border: 0; border-radius: 0; background: transparent; text-align: left;
  font: 500 13px var(--font-body); color: var(--fg); padding: 5px 0;
}
button.grow:hover { background: transparent; }
button.grow .nm { font-weight: 600; }
.brow.sub { padding-left: 14px; grid-template-columns: calc(8.5em - 14px) minmax(0, 1fr) 3.6em; color: var(--muted); }
.brow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chev { display: inline-block; width: 0; height: 0; border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; margin-right: 7px; }
.grow.open .chev { transform: rotate(90deg); }
.track { position: relative; height: 14px; }
.track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: 0.5; }
.bar-pm, .bar-duo { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; }
.bar-pm { left: 50%; background: var(--pm); }
.bar-duo { right: 50%; background: var(--duo); }
.sub .bar-pm, .sub .bar-duo { opacity: 0.7; }
.bv { font: 12.5px var(--font-num); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bv.pm { color: var(--pm-text); }
.bv.duo { color: var(--duo-text); }
.btotal { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; }
.btotal b { font: 500 13px var(--font-num); }
.sens { margin: 8px 0 0; font-size: 14px; max-width: 62ch; }
.copy-msg { font-size: 13px; color: var(--muted); }

.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
  background: rgba(8, 12, 18, 0.6);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet[hidden] { display: none; }
.sheet-in { width: 100%; max-width: 460px; max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 12px; }
.sheet-in img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); }
.sheet-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 420px) {
  .tn { font-size: 32px; }
  .res { padding: 16px 14px 18px; }
  .axis-cap, .brow { grid-template-columns: 7em minmax(0, 1fr) 3.4em; }
  .brow.sub { grid-template-columns: calc(7em - 14px) minmax(0, 1fr) 3.4em; }
}
</style>
</head>
<body>

<header class="bar gut">
  <div class="bar-in">
    <div class="brand"><strong>18PM vs Duo</strong><span>决策矩阵</span></div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="gut">
  <div class="wrap">
    <div class="tools">
      <div class="seg" id="presets" role="group" aria-label="权重方案"></div>
      <span class="spacer"></span>
      <span class="undo" id="undo" hidden><span id="undo-msg"></span><button type="button" id="undo-btn">撤销</button></span>
      <button type="button" id="export">导出结果</button>
      <button type="button" id="reset">恢复初始</button>
    </div>

    <div class="cols">
      <section aria-labelledby="h-in">
        <div class="sec-head"><h2 id="h-in">打分与权重</h2></div>
        <div id="dims"></div>
      </section>

      <section class="results" aria-label="评分结果">
        <div class="res">
          <h2>总分（满分 5）</h2>
          <div class="totals">
            <div class="tot pm" id="tot-pm"><div class="tl">18 Pro Max</div><div class="tn" id="tn-pm">0.00</div><div class="meter"><i id="m-pm"></i></div></div>
            <div class="tot duo" id="tot-duo"><div class="tl">Duo</div><div class="tn" id="tn-duo">0.00</div><div class="meter"><i id="m-duo"></i></div></div>
          </div>
          <p class="verdict" id="verdict"></p>
        </div>

        <div class="res">
          <h2>各项得分</h2>
          <div class="radar-wrap"><svg class="radar" id="radar" viewBox="0 0 440 400" role="img" aria-label="两台手机各项得分的雷达图"></svg></div>
          <div class="legend"><span class="pm"><i></i>18 Pro Max</span><span class="duo"><i></i>Duo</span></div>
        </div>

        <div class="res">
          <h2>分差从哪里来</h2>
          <div class="axis-cap" aria-hidden="true"><div></div><div><span class="l">← Duo 多得</span><span class="r">18 Pro Max 多得 →</span></div><div></div></div>
          <div id="bars"></div>
          <div class="btotal"><span>合计（18 Pro Max − Duo）</span><b id="btotal"></b></div>
        </div>

        <div class="res">
          <h2>结论有多稳</h2>
          <p class="sens" id="sens"></p>
        </div>
      </section>
    </div>
  </div>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-label="导出结果">
    <img id="card" alt="结果图片">
    <div class="sheet-bar">
      <button type="button" id="cp-img">复制图片</button>
      <button type="button" id="cp-txt">复制文字</button>
      <a class="btn" id="save" download="18PM-vs-Duo.png">保存图片</a>
      <button type="button" id="close">关闭</button>
      <span class="copy-msg" id="msg" role="status"></span>
    </div>
  </div>
</div>

<script>
(function () {
  /* ---------- defaults ---------- */
  var DEF = [
    { k: 'soft', name: '软件与系统体验', hint: '可以通过苹果的软件更新改善的部分', w: 32, items: [
      { k: 'app', name: '第三方 App 适配', s: 'App 适配', w: 15, pm: 5, duo: 1.5,
        hint: '抖音完全没有适配，连全屏看视频都不行；微信适配也很差。每打开一个 App 都要赌一次它适不适配。' },
      { k: 'stab', name: '系统稳定性与 BUG', s: '稳定性', w: 11, pm: 5, duo: 2.5,
        hint: '软件层面：Duo 上经常出现 bug；18PM 像一个可靠的老伙计。' },
      { k: 'rot', name: '自动旋转与躺姿使用', s: '旋转逻辑', w: 6, pm: 4.5, duo: 2,
        hint: '躺着玩手机要经常调转方向，自动判断转向的逻辑也让人抓狂。' }
    ] },
    { k: 'hard', name: '硬件与工艺', hint: '硬件层面的差异，软件更新改变不了', w: 37, items: [
      { k: 'hw', name: '硬件可靠性与返修风险', s: '硬件可靠', w: 12, pm: 5, duo: 2,
        hint: '你提到 Duo 的屏幕问题已被大规模披露。这类工艺隐患可能影响日常使用，甚至让你一段时间没有手机可用。这一项看返修风险和停机后果。' },
      { k: 'cam', name: '摄影', s: '摄影', w: 8, pm: 5, duo: 3,
        hint: '18PM 是成熟的旗舰摄影配置。' },
      { k: 'face', name: 'Face ID', s: 'Face ID', w: 5, pm: 5, duo: 3,
        hint: '18PM 的 Face ID 很成熟。' },
      { k: 'bat', name: '续航', s: '续航', w: 7, pm: 4.5, duo: 3,
        hint: '18PM 的续航有优势。Duo 的分数是占位，等你各用一整天实测后再改。' },
      { k: 'mat', name: '材质工艺与手感', s: '材质手感', w: 5, pm: 3.5, duo: 5,
        hint: 'Duo 的钛金属边框工艺是你更喜欢的，手感和外观精致得像玩具。18PM 的分是占位，请按你握在手里的对比来改。' }
    ] },
    { k: 'form', name: '新形态体验', hint: '折叠形态带来的独特体验', w: 18, items: [
      { k: 'disp', name: '展开大屏体验', s: '大屏体验', w: 9, pm: 3, duo: 5,
        hint: '展开后的大屏体验很独特，显示效果也很惊艳。大屏在 App 没适配时用不上的部分，已经在「App 适配」里扣过，这里只评能用上时的体验。' },
      { k: 'excl', name: '独占功能', s: '独占功能', w: 6, pm: 1, duo: 4.5,
        hint: '分屏多任务，半折叠形态下独特的 StandBy 设计。偶尔用到会很开心，18PM 没有这些。' },
      { k: 'nov', name: '新形态的新鲜感', s: '新鲜感', w: 3, pm: 3, duo: 5,
        hint: '新形态带来的新鲜感。它通常会随时间衰减，可以只给三个月后仍然保留的那一部分打分。' }
    ] },
    { k: 'life', name: '适应与长期', hint: '个人适应成本与长期持有', w: 13, items: [
      { k: 'adapt', name: '日常适应成本', s: '适应成本', w: 6, pm: 5, duo: 2,
        hint: '从 17PM 换到 18PM 几乎不用适应；Duo 用了十天，仍有很多地方不适应。' },
      { k: 'long', name: '长期价值', s: '长期价值', w: 7, pm: 4, duo: 3,
        hint: '保值、配件、系统支持。Duo 的 App 适配以后可能改善，也可能没有，这一项请按你的判断调整。' }
    ] }
  ];
  var META = {};
  DEF.forEach(function (g) {
    META[g.k] = { hint: g.hint };
    g.items.forEach(function (it) { META[it.k] = { s: it.s, hint: it.hint }; });
  });
  var PRESETS = [
    { id: 'main', label: '当唯一主力机', w: { soft: 32, hard: 37, form: 18, life: 13 } },
    { id: 'fun', label: '偏重体验乐趣', w: { soft: 16, hard: 34, form: 41, life: 9 } },
    { id: 'even', label: '均衡', w: { soft: 25, hard: 25, form: 25, life: 25 } }
  ];
  var KEY = 'phone-matrix-v3';
  var uid = 0;
  function nid(p) { uid++; return p + uid; }

  function defaults() {
    uid = 0;

  /* ---------- state + persistence ---------- */
  function num(v, lo, hi) { return typeof v === 'number' && isFinite(v) && v >= lo && v <= hi; }

    if (!st || !Array.isArray(st.groups) || !st.groups.length || st.groups.length > 12) return false;
    var gs = 0, i, keys = {};
    for (i = 0; i < st.groups.length; i++) {
      var g = st.groups[i];
      if (!g || typeof g.id !== 'string' || typeof g.name !== 'string' || !num(g.w, 0, 100)) return false;
      if (!Array.isArray(g.items) || !g.items.length || g.items.length > 20) return false;
      var is = 0;
      for (var j = 0; j < g.items.length; j++) {
        var it = g.items[j];
        if (!it || typeof it.id !== 'string' || typeof it.name !== 'string' || !num(it.w, 0, 100) || !num(it.pm, 1, 5) || !num(it.duo, 1, 5)) return false;
        if (it.k && !META[it.k]) return false;
        is += it.w;
      }
      if (Math.abs(is - 100) > 0.5) return false;

  /* ---------- helpers ---------- */

  function findG(id) { for (var i = 0; i < S.groups.length; i++) if (S.groups[i].id === id) return i; return -1; }

  /* ---------- sensitivity ---------- */
  function sensitivity(F) {

      for (it = 0; it < 50; it++) { mid = (lo + hi) / 2; if (diffAt(mid) > 0) lo = mid; else hi = mid; }

  /* ---------- radar ---------- */

  /* ---------- bars: groups first, items on demand ---------- */

  /* ---------- export ---------- */
  var CP = { bg: '#FFFFFF', fg: '#141A23', mu: '#566172', ln: '#D3D9E1', tr: '#E6EAF0', pm: '#2563C9', duo: '#D9660B',

  var FB = "'IBM Plex Sans','PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif";
  var FN = "'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace";

  function presetTargets(p) {
    var built = S.groups.filter(function (g) { return g.k; });

    var P = sum(built.map(function (g) { return p.w[g.k]; })), t = {};

    };
  }
  function verdictText(F) {

  function exportText() {
    var F = flat(), g = groups(F);

    if (g.pm.length) L.push('18 Pro Max 占优：' + g.pm.join('、'));

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function wrap(ctx, text, x, y, maxW, lh) {
    var line = '';
    for (var k = 0; k < text.length; k++) {
      var t = line + text.charAt(k);
      if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = text.charAt(k); }
      else line = t;
    }
    if (line) { ctx.fillText(line, x, y); y += lh; }
    return y;
  }
  function drawCard(cv, H) {
    var sc = 2, ctx = cv.getContext('2d'), i, F = flat(), N = F.length;
    cv.width = 900 * sc; cv.height = H * sc; ctx.scale(sc, sc);
    ctx.fillStyle = CP.bg; ctx.fillRect(0, 0, 900, H);
    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'left'; ctx.fillStyle = CP.fg; ctx.font = '600 28px ' + FB;
    ctx.fillText('18 Pro Max vs Duo', 48, 76);
    ctx.textAlign = 'right'; ctx.fillStyle = CP.mu; ctx.font = '400 20px ' + FB;
    ctx.fillText(presetLabel(), 852, 76);

    var tp = total(F, 'pm'), td = total(F, 'duo'), d = tp - td;
    [{ x: 48, name: '18 Pro Max', v: tp, c: CP.pm, lead: d > 0.005 }, { x: 462, name: 'Duo', v: td, c: CP.duo, lead: d < -0.005 }].forEach(function (b) {
      rr(ctx, b.x, 108, 390, 132, 8);
      ctx.lineWidth = b.lead ? 3 : 1; ctx.strokeStyle = b.lead ? b.c : CP.ln; ctx.stroke();
      ctx.textAlign = 'left'; ctx.fillStyle = CP.mu; ctx.font = '400 22px ' + FB; ctx.fillText(b.name, b.x + 20, 144);
      ctx.fillStyle = b.c; ctx.font = '500 56px ' + FN; var s = f2(b.v); ctx.fillText(s, b.x + 20, 202);
      var wd = ctx.measureText(s).width;
      ctx.fillStyle = CP.mu; ctx.font = '400 22px ' + FN; ctx.fillText('/5', b.x + 26 + wd, 202);
      ctx.fillStyle = CP.tr; rr(ctx, b.x + 20, 218, 350, 8, 4); ctx.fill();
      ctx.fillStyle = b.c; rr(ctx, b.x + 20, 218, Math.max(8, 350 * b.v / 5), 8, 4); ctx.fill();
    });

    ctx.textAlign = 'center'; ctx.font = '600 26px ' + FB;
    ctx.fillStyle = Math.abs(d) < 0.1 ? CP.fg : (d > 0 ? CP.pm : CP.duo);
    ctx.fillText(verdictText(F), 450, 292);

    var cx = 450, cy = 560, R = 170, r;
    function pt(idx, v) { var a = -Math.PI / 2 + idx * 2 * Math.PI / N, q = R * v / 5; return [cx + q * Math.cos(a), cy + q * Math.sin(a)]; }
    function path(vals) { ctx.beginPath(); vals.forEach(function (v, k) { var q = pt(k, v); if (k) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }); ctx.closePath(); }
    for (r = 1; r <= 5; r++) {
      var ring = []; for (i = 0; i < N; i++) ring.push(r);
      path(ring); ctx.lineWidth = 1; ctx.strokeStyle = r === 5 ? '#8B95A5' : CP.ln; ctx.stroke();
    }
    for (i = 0; i < N; i++) { var e = pt(i, 5); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(e[0], e[1]); ctx.strokeStyle = CP.ln; ctx.lineWidth = 1; ctx.stroke(); }
    [[F.map(function (x) { return x.pm; }), CP.pm, CP.pmf], [F.map(function (x) { return x.duo; }), CP.duo, CP.duof]].forEach(function (a) {
      path(a[0]); ctx.fillStyle = a[2]; ctx.fill(); ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = a[1]; ctx.stroke();
      a[0].forEach(function (v, k) { var q = pt(k, v); ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, Math.PI * 2); ctx.fillStyle = a[1]; ctx.fill(); });
    });
    ctx.font = '400 20px ' + FB; ctx.fillStyle = CP.fg;
    for (i = 0; i < N; i++) {
      var ang = -Math.PI / 2 + i * 2 * Math.PI / N, c = Math.cos(ang), s2 = Math.sin(ang);
      ctx.textAlign = c > 0.3 ? 'left' : (c < -0.3 ? 'right' : 'center');
      ctx.fillText(F[i].s, cx + (R + 20) * c, cy + (R + 20) * s2 + (s2 > 0.5 ? 16 : (s2 < -0.5 ? -4 : 7)));
    }

    var y = 828;
    ctx.font = '400 20px ' + FB; ctx.textAlign = 'left';
    ctx.fillStyle = CP.pm; ctx.fillRect(306, y - 14, 14, 14); ctx.fillStyle = CP.mu; ctx.fillText('18 Pro Max', 326, y);
    ctx.fillStyle = CP.duo; ctx.fillRect(500, y - 14, 14, 14); ctx.fillStyle = CP.mu; ctx.fillText('Duo', 520, y);
    y += 56;
    var g = groups(F);
    [['18 Pro Max 占优', g.pm, CP.pm], ['Duo 占优', g.duo, CP.duo]].forEach(function (blk) {
      if (!blk[1].length) return;
      ctx.textAlign = 'left'; ctx.font = '600 20px ' + FB; ctx.fillStyle = blk[2]; ctx.fillText(blk[0], 48, y);
      ctx.font = '400 20px ' + FB; ctx.fillStyle = CP.fg;
      y = wrap(ctx, blk[1].join('、'), 48, y + 32, 804, 30) + 14;
    });
    return y;
  }

  var cardCv = null;
  function msg(t) { $('msg').textContent = t || ''; }
  function openExport() {
    function go() {
      var t = document.createElement('canvas'), endY = drawCard(t, 1700);
      var cv = document.createElement('canvas'); drawCard(cv, Math.ceil(endY) + 20);
      cardCv = cv;
      var url = cv.toDataURL('image/png');
      $('card').src = url; $('save').href = url;
      msg(''); $('sheet').hidden = false; $('close').focus();
    }
    try { document.fonts.ready.then(go, go); } catch (e) { go(); }
  }
  function closeExport() { $('sheet').hidden = true; }
  $('export').addEventListener('click', openExport);
  $('close').addEventListener('click', closeExport);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeExport(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeExport(); });
  if (window.claude) $('save').hidden = true;
  $('cp-txt').addEventListener('click', function () {
    try { navigator.clipboard.writeText(exportText()).then(function () { msg('已复制'); }, function () { msg('复制失败'); }); }
    catch (e) { msg('复制失败'); }
  });
  $('cp-img').addEventListener('click', function () {
    try {
      var blob = new Promise(function (res) { cardCv.toBlob(res, 'image/png'); });
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () { msg('已复制'); }, function () { msg('复制失败，请长按或右键图片'); });
    } catch (e) { msg('复制失败，请长按或右键图片'); }
  });

  /* ---------- update ---------- */
  function update() {
    var F = flat();
    var gws = lrm(S.groups.map(function (g) { return g.w; }), 100);
    S.groups.forEach(function (g, gi) {
      var gs = $('gw-' + g.id);
      gs.value = gws[gi]; gs.disabled = S.groups.length === 1;
      $('ogw-' + g.id).textContent = gws[gi] + '%';
      var iws = lrm(g.items.map(function (x) { return x.w; }), 100);
      g.items.forEach(function (it, ii) {
        $('pm-' + it.id).value = it.pm; $('duo-' + it.id).value = it.duo;
        $('o-pm-' + it.id).textContent = it.pm.toFixed(1);
        $('o-duo-' + it.id).textContent = it.duo.toFixed(1);
        var iw = $('iw-' + it.id);
        iw.value = iws[ii]; iw.disabled = g.items.length === 1;
        $('o-iw-' + it.id).textContent = iws[ii] + '%';
        $('share-' + it.id).textContent = '总 ' + Math.round(g.w * it.w / 100) + '%';
      });
    });

    var matched = presetLabel();
    PRESETS.forEach(function (p) {
      document.querySelector('button[data-preset="' + p.id + '"]').setAttribute('aria-pressed', p.label === matched ? 'true' : 'false');
    });

    var tp = total(F, 'pm'), td = total(F, 'duo'), d = tp - td;
    $('tn-pm').innerHTML = f2(tp) + '<small>/5</small>';
    $('tn-duo').innerHTML = f2(td) + '<small>/5</small>';
    $('m-pm').style.width = (tp / 5 * 100).toFixed(1) + '%';
    $('m-duo').style.width = (td / 5 * 100).toFixed(1) + '%';
    $('tot-pm').className = 'tot pm' + (d > 0.005 ? ' lead' : '');
    $('tot-duo').className = 'tot duo' + (d < -0.005 ? ' lead' : '');
    $('chips').innerHTML =
      '<span class="chip pm"><i></i>18 Pro Max <b>' + f2(tp) + '</b></span>' +
      '<span class="chip duo"><i></i>Duo <b>' + f2(td) + '</b></span>';

    var vt = verdictText(F);
    $('verdict').innerHTML = Math.abs(d) < 0.1 ? vt + '。' : '<b>' + vt.replace(' 领先', '</b> 领先') + '。';
    $('btotal').textContent = sgn(d);
    $('sens').textContent = sensitivity(F);
    radar(F); bars(F); save();
  }

  buildInputs();
  update();
})();
</script>
